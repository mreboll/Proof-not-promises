# CI: tests unitarios (sin claves ni red: los LLM se simulan) y el pipeline con la evidencia grabada en fixtures/.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: "Unit tests (sin claves: los LLM se simulan)"
        run: python -m pytest -q --cov=ledger --cov-report=term-missing
      - name: Pipeline con fixtures
        run: python -m ledger run --issue 2283 --fixtures --fake-runner
